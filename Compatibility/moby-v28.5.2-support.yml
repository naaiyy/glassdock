schema: 1
source:
  repository: moby/moby
  ref: v28.5.2
  url: https://raw.githubusercontent.com/moby/moby/v28.5.2/api/swagger.yaml
  sha256: 2afceffc4138e3f4a030140c14f27d4118cec99024695f53d4884c79f3a10138
  apiVersion: "1.51"

# Entries not listed here are generated as explicit 501 Not Implemented
# endpoints. A route is listed only when Glass Dock can answer the operation
# with the persistent guest runtime, even if some optional request variants
# remain unsupported.
routes:
  - method: GET
    path: /_ping
    support: implemented
    owner: HealthCheckPingRoute
    note: Docker daemon liveness and API-version headers.
  - method: HEAD
    path: /_ping
    support: implemented
    owner: HealthCheckPingRoute
    note: Header-only Docker daemon liveness check.
  - method: POST
    path: /auth
    support: implemented
    owner: AuthRoute
    note: Registry credential validation.
  - method: GET
    path: /containers/json
    support: partial
    owner: DockerRuntimeRoutes
    note: Container listing and supported id, name, status, ancestor, and label filters.
  - method: POST
    path: /containers/create
    support: partial
    owner: DockerRuntimeRoutes
    note: Persistent containerd creation with explicit 501 responses for unsupported options.
  - method: DELETE
    path: /containers/{id}
    support: partial
    owner: DockerRuntimeRoutes
    note: Container removal and named-volume reference release.
  - method: GET
    path: /containers/{id}/json
    support: partial
    owner: DockerRuntimeRoutes
    note: Docker inspect response built from guest state and host metadata.
  - method: GET
    path: /containers/{id}/logs
    support: partial
    owner: DockerRuntimeRoutes
    note: Stored stdout and stderr with stream framing and tail filtering; follow and timestamp modes remain unsupported.
  - method: POST
    path: /containers/prune
    support: partial
    owner: DockerRuntimeRoutes
    note: Removes non-running containers with label and until filters; guest snapshot byte accounting reports zero.
  - method: POST
    path: /containers/{id}/attach
    support: partial
    owner: DockerRuntimeRoutes
    note: Read-only attach with raw stream framing; interactive stdin remains unsupported.
  - method: POST
    path: /containers/{id}/exec
    support: partial
    owner: DockerRuntimeRoutes
    note: Exec creation and guest-backed command execution without interactive stdin.
  - method: POST
    path: /containers/{id}/start
    support: implemented
    owner: DockerRuntimeRoutes
    note: Starts a persistent guest container and republishes ports.
  - method: POST
    path: /containers/{id}/pause
    support: implemented
    owner: DockerRuntimeRoutes
    note: Pauses a running guest task through containerd.
  - method: POST
    path: /containers/{id}/unpause
    support: implemented
    owner: DockerRuntimeRoutes
    note: Resumes a paused guest task through containerd.
  - method: POST
    path: /containers/{id}/rename
    support: implemented
    owner: DockerRuntimeRoutes
    note: Persists the Docker-facing container name in guest metadata.
  - method: POST
    path: /containers/{id}/resize
    support: partial
    owner: DockerRuntimeRoutes
    note: Resizes a running TTY container through containerd.
  - method: POST
    path: /containers/{id}/restart
    support: partial
    owner: DockerRuntimeRoutes
    note: Stops and starts a guest container with Docker timeout and signal handling.
  - method: GET
    path: /containers/{id}/top
    support: partial
    owner: DockerRuntimeRoutes
    note: Reports guest task PIDs and command names from the container process namespace.
  - method: GET
    path: /containers/{id}/stats
    support: partial
    owner: DockerRuntimeRoutes
    note: Reports guest process, memory, CPU, network, and PID samples; cgroup details vary by guest runtime.
  - method: GET
    path: /containers/{id}/export
    support: partial
    owner: DockerRuntimeRoutes
    note: Streams a tar archive of the guest container root filesystem.
  - method: GET
    path: /containers/{id}/archive
    support: partial
    owner: DockerRuntimeRoutes
    note: Reads a path from the guest root filesystem as a tar stream and returns Docker path-stat metadata.
  - method: HEAD
    path: /containers/{id}/archive
    support: partial
    owner: DockerRuntimeRoutes
    note: Reports Docker path-stat metadata for a guest filesystem path.
  - method: PUT
    path: /containers/{id}/archive
    support: partial
    owner: DockerRuntimeRoutes
    note: Applies a bounded tar request to a guest root filesystem directory.
  - method: GET
    path: /containers/{id}/changes
    support: partial
    owner: DockerRuntimeRoutes
    note: Computes guest snapshot changes against the image parent snapshot.
  - method: POST
    path: /containers/{id}/stop
    support: partial
    owner: DockerRuntimeRoutes
    note: Signal and timeout handling with a forced kill after timeout.
  - method: POST
    path: /containers/{id}/kill
    support: implemented
    owner: DockerRuntimeRoutes
    note: Sends a validated signal to the guest container.
  - method: POST
    path: /containers/{id}/wait
    support: partial
    owner: DockerRuntimeRoutes
    note: Default, next-exit, not-running, and removed waits; healthy waits are explicit 501 responses.
  - method: POST
    path: /exec/{id}/start
    support: partial
    owner: DockerRuntimeRoutes
    note: Streaming exec start; detached exec and interactive stdin are unsupported.
  - method: GET
    path: /exec/{id}/json
    support: partial
    owner: DockerRuntimeRoutes
    note: Host-side exec lifecycle inspection.
  - method: GET
    path: /events
    support: implemented
    owner: EventsRoute
    note: Persistent guest event stream with Docker event filtering.
  - method: POST
    path: /images/create
    support: partial
    owner: DockerRuntimeRoutes
    note: Guest-backed image pull; tar import through fromSrc remains unsupported.
  - method: GET
    path: /images/json
    support: partial
    owner: DockerRuntimeRoutes
    note: Image listing with reference filtering.
  - method: GET
    path: /images/{name}/json
    support: partial
    owner: DockerRuntimeRoutes
    note: Guest image inspection with Docker-compatible core fields.
  - method: DELETE
    path: /images/{name}
    support: implemented
    owner: DockerRuntimeRoutes
    note: Guest image deletion with force handling.
  - method: POST
    path: /images/prune
    support: partial
    owner: DockerRuntimeRoutes
    note: Guest image pruning with dangling filter handling.
  - method: POST
    path: /images/{name}/tag
    support: implemented
    owner: DockerRuntimeRoutes
    note: Adds a guest image reference.
  - method: GET
    path: /images/get
    support: partial
    owner: DockerRuntimeRoutes
    note: Exports one or more guest images as an OCI/containerd tar archive.
  - method: GET
    path: /images/{name}/get
    support: partial
    owner: DockerRuntimeRoutes
    note: Exports one guest image as an OCI/containerd tar archive.
  - method: GET
    path: /images/{name}/history
    support: partial
    owner: DockerRuntimeRoutes
    note: Reports history from the guest image OCI configuration and layer metadata.
  - method: POST
    path: /images/{name}/push
    support: partial
    owner: DockerRuntimeRoutes
    note: Pushes a guest image through containerd with optional registry credentials and platform selection.
  - method: GET
    path: /distribution/{name}/json
    support: implemented
    owner: DistributionJsonRoute
    note: Registry manifest and platform inspection.
  - method: GET
    path: /info
    support: partial
    owner: DockerRuntimeRoutes
    note: Reports live guest counts and host/runtime metadata with capability warnings.
  - method: GET
    path: /system/df
    support: partial
    owner: DockerRuntimeRoutes
    note: Reports guest image and container accounting; volume and build-cache accounting are empty.
  - method: GET
    path: /version
    support: implemented
    owner: VersionRoute
    note: Glass Dock build and Docker API compatibility versions.
  - method: POST
    path: /volumes/create
    support: implemented
    owner: VolumeCreateRoute
    note: Local persistent volume creation.
  - method: GET
    path: /volumes
    support: implemented
    owner: VolumeListRoute
    note: Local volume listing.
  - method: GET
    path: /volumes/{name}
    support: implemented
    owner: VolumeInspectRoute
    note: Local volume inspection.
  - method: DELETE
    path: /volumes/{name}
    support: implemented
    owner: VolumeDeleteRoute
    note: Local volume deletion with in-use protection.
  - method: POST
    path: /volumes/prune
    support: implemented
    owner: VolumePruneRoute
    note: Anonymous and all-volume pruning with label filters.
