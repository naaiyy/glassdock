schema: 1
source:
  repository: moby/moby
  ref: v28.5.2
  url: https://raw.githubusercontent.com/moby/moby/v28.5.2/api/swagger.yaml
  sha256: 2afceffc4138e3f4a030140c14f27d4118cec99024695f53d4884c79f3a10138
  apiVersion: "1.51"

# Entries not listed here are generated as explicit 501 Not Implemented
# endpoints. Every Moby v1.51 operation is listed in this manifest; the route
# entries describe the persistent guest or host control-plane behavior used
# for that operation.
routes:
  - method: POST
    path: /build
    support: implemented
    owner: DockerRuntimeRoutes
    note: Builds Dockerfiles in the persistent guest runtime with local and remote ADD, multi-stage COPY, RUN, ARG, SHELL, and health-check configuration support.
  - method: POST
    path: /build/prune
    support: implemented
    owner: DockerRuntimeRoutes
    note: Validates Docker build-cache filters and returns the Docker prune result for the guest-owned build cache model.
  - method: GET
    path: /_ping
    support: implemented
    owner: HealthCheckPingRoute
    note: Docker daemon liveness and API-version headers.
  - method: HEAD
    path: /_ping
    support: implemented
    owner: HealthCheckPingRoute
    note: Header-only Docker daemon liveness check.
  - method: POST
    path: /auth
    support: implemented
    owner: AuthRoute
    note: Registry credential validation.
  - method: GET
    path: /containers/json
    support: implemented
    owner: DockerRuntimeRoutes
    note: Lists persistent guest containers with Docker pagination, size fields, and id, name, status, ancestor, time, network, port, volume, health, task, and label filters.
  - method: POST
    path: /containers/create
    support: implemented
    owner: DockerRuntimeRoutes
    note: Creates persistent guest containers and stores Docker command, environment, mount, network, health, restart, resource, and metadata settings.
  - method: DELETE
    path: /containers/{id}
    support: implemented
    owner: DockerRuntimeRoutes
    note: Container removal and named-volume reference release.
  - method: GET
    path: /containers/{id}/json
    support: implemented
    owner: DockerRuntimeRoutes
    note: Docker inspect response built from guest state and host metadata.
  - method: GET
    path: /containers/{id}/logs
    support: implemented
    owner: DockerRuntimeRoutes
    note: Stores stdout and stderr with Docker framing, tail, timestamp, time-range, details, replay, follow, and interactive stream handling.
  - method: POST
    path: /containers/prune
    support: implemented
    owner: DockerRuntimeRoutes
    note: Removes non-running containers with Docker label and until filters and reports guest snapshot accounting.
  - method: POST
    path: /containers/{id}/update
    support: implemented
    owner: DockerRuntimeRoutes
    note: Updates live guest CPU, memory, cpuset, PIDs, swap, reservation, quota, and restart-policy settings with Docker warnings.
  - method: POST
    path: /containers/{id}/attach
    support: implemented
    owner: DockerRuntimeRoutes
    note: Attaches to guest stdout and stderr with Docker raw-stream framing, replay selection, follow mode, and stdin relay.
  - method: GET
    path: /containers/{id}/attach/ws
    support: implemented
    owner: DockerRuntimeRoutes
    note: Provides WebSocket attach with Docker raw-stream framing, replay selection, follow mode, and stdin relay.
  - method: POST
    path: /containers/{id}/exec
    support: implemented
    owner: DockerRuntimeRoutes
    note: Exec creation and guest-backed command execution without interactive stdin.
  - method: POST
    path: /containers/{id}/start
    support: implemented
    owner: DockerRuntimeRoutes
    note: Starts a persistent guest container and republishes ports.
  - method: POST
    path: /containers/{id}/pause
    support: implemented
    owner: DockerRuntimeRoutes
    note: Pauses a running guest task through containerd.
  - method: POST
    path: /containers/{id}/unpause
    support: implemented
    owner: DockerRuntimeRoutes
    note: Resumes a paused guest task through containerd.
  - method: POST
    path: /containers/{id}/rename
    support: implemented
    owner: DockerRuntimeRoutes
    note: Persists the Docker-facing container name in guest metadata.
  - method: POST
    path: /containers/{id}/resize
    support: implemented
    owner: DockerRuntimeRoutes
    note: Resizes a running TTY container through containerd.
  - method: POST
    path: /containers/{id}/restart
    support: implemented
    owner: DockerRuntimeRoutes
    note: Stops and starts a guest container with Docker timeout and signal handling.
  - method: GET
    path: /containers/{id}/top
    support: implemented
    owner: DockerRuntimeRoutes
    note: Reports guest task PIDs and command names from the container process namespace.
  - method: GET
    path: /containers/{id}/stats
    support: implemented
    owner: DockerRuntimeRoutes
    note: Reports guest process, memory, CPU, network, and PID samples with streaming and one-shot modes; cgroup details vary by guest runtime.
  - method: GET
    path: /containers/{id}/export
    support: implemented
    owner: DockerRuntimeRoutes
    note: Streams a tar archive of the guest container root filesystem.
  - method: GET
    path: /containers/{id}/archive
    support: implemented
    owner: DockerRuntimeRoutes
    note: Reads a path from the guest root filesystem as a tar stream and returns Docker path-stat metadata.
  - method: HEAD
    path: /containers/{id}/archive
    support: implemented
    owner: DockerRuntimeRoutes
    note: Reports Docker path-stat metadata for a guest filesystem path.
  - method: PUT
    path: /containers/{id}/archive
    support: implemented
    owner: DockerRuntimeRoutes
    note: Applies a bounded tar request to a guest root filesystem directory.
  - method: GET
    path: /containers/{id}/changes
    support: implemented
    owner: DockerRuntimeRoutes
    note: Computes guest snapshot changes against the image parent snapshot.
  - method: POST
    path: /containers/{id}/stop
    support: implemented
    owner: DockerRuntimeRoutes
    note: Signal and timeout handling with a forced kill after timeout.
  - method: POST
    path: /containers/{id}/kill
    support: implemented
    owner: DockerRuntimeRoutes
    note: Sends a validated signal to the guest container.
  - method: POST
    path: /containers/{id}/wait
    support: implemented
    owner: DockerRuntimeRoutes
    note: Default, next-exit, not-running, and removed waits; healthy waits report the Docker error when no healthcheck exists.
  - method: POST
    path: /exec/{id}/start
    support: implemented
    owner: DockerRuntimeRoutes
    note: Starts detached or streaming guest exec processes with Docker stdcopy framing, terminal mode, and stdin relay.
  - method: POST
    path: /exec/{id}/resize
    support: implemented
    owner: DockerRuntimeRoutes
    note: Resizes an active guest exec terminal through containerd; exited execs return an error.
  - method: GET
    path: /exec/{id}/json
    support: implemented
    owner: DockerRuntimeRoutes
    note: Host-side exec lifecycle inspection.
  - method: GET
    path: /events
    support: implemented
    owner: EventsRoute
    note: Persistent guest event stream with Docker event filtering.
  - method: POST
    path: /images/create
    support: implemented
    owner: DockerRuntimeRoutes
    note: Guest-backed image pull; fromSrc tar import is supported for archives up to the guest protocol limit.
  - method: GET
    path: /images/json
    support: implemented
    owner: DockerRuntimeRoutes
    note: Image listing with reference, dangling, label, and date filters.
  - method: GET
    path: /images/{name}/json
    support: implemented
    owner: DockerRuntimeRoutes
    note: Inspects guest image identity, platform, config, history, Docker health-check, shell, and layer metadata.
  - method: DELETE
    path: /images/{name}
    support: implemented
    owner: DockerRuntimeRoutes
    note: Guest image deletion with force handling.
  - method: POST
    path: /images/prune
    support: implemented
    owner: DockerRuntimeRoutes
    note: Guest image pruning with dangling filter handling.
  - method: GET
    path: /images/search
    support: implemented
    owner: ImageSearchRoute
    note: Docker Hub repository search with limit, official, automated, and star filters; custom registry search is not exposed.
  - method: POST
    path: /images/{name}/tag
    support: implemented
    owner: DockerRuntimeRoutes
    note: Adds a guest image reference.
  - method: GET
    path: /images/get
    support: implemented
    owner: DockerRuntimeRoutes
    note: Exports one or more guest images as an OCI/containerd tar archive.
  - method: GET
    path: /images/{name}/get
    support: implemented
    owner: DockerRuntimeRoutes
    note: Exports one guest image as an OCI/containerd tar archive.
  - method: POST
    path: /images/load
    support: implemented
    owner: DockerRuntimeRoutes
    note: Imports named OCI or Docker image archives into the guest for archives up to 10 MiB; larger archives need a streaming guest upload protocol.
  - method: GET
    path: /images/{name}/history
    support: implemented
    owner: DockerRuntimeRoutes
    note: Reports history from the guest image OCI configuration and layer metadata.
  - method: POST
    path: /images/{name}/push
    support: implemented
    owner: DockerRuntimeRoutes
    note: Pushes a guest image through containerd with optional registry credentials and platform selection.
  - method: POST
    path: /commit
    support: implemented
    owner: DockerRuntimeRoutes
    note: Commits a guest container filesystem diff as a new image layer and applies Docker configuration, health-check, shell, and ONBUILD changes.
  - method: GET
    path: /networks
    support: implemented
    owner: DockerRuntimeRoutes
    note: Lists guest-owned bridge and custom network objects with prepared container endpoints.
  - method: GET
    path: /networks/{id}
    support: implemented
    owner: DockerRuntimeRoutes
    note: Inspects guest-owned bridge and custom network objects by name or ID.
  - method: POST
    path: /networks/prune
    support: implemented
    owner: DockerRuntimeRoutes
    note: Validates Docker network filters, deletes eligible custom networks, and protects the guest runtime's private bridge.
  - method: DELETE
    path: /networks/{id}
    support: implemented
    owner: DockerRuntimeRoutes
    note: Deletes eligible custom networks and returns Docker's protected-network error for the guest runtime bridge.
  - method: POST
    path: /networks/create
    support: implemented
    owner: DockerRuntimeRoutes
    note: Creates guest-owned bridge, internal, IPv4, IPv6, and IPAM network state with Docker network metadata and options.
  - method: POST
    path: /networks/{id}/connect
    support: implemented
    owner: DockerRuntimeRoutes
    note: Connects stopped guest containers to guest network objects; running-container hot attach returns a conflict until guest namespace attachment is available.
  - method: POST
    path: /networks/{id}/disconnect
    support: implemented
    owner: DockerRuntimeRoutes
    note: Disconnects guest network endpoints from stopped containers and protects the default bridge network.
  - method: GET
    path: /configs
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Lists persistent single-daemon config objects with Docker name, id, label, and id filters.
  - method: POST
    path: /configs/create
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Creates persistent config metadata and base64 data outside the guest scheduler.
  - method: DELETE
    path: /configs/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Deletes a persistent config by full or unique id prefix.
  - method: GET
    path: /configs/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Inspects a persistent config with Docker object and spec fields.
  - method: POST
    path: /configs/{id}/update
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Updates config spec and increments its object version.
  - method: GET
    path: /secrets
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Lists persistent secret metadata without exposing secret data.
  - method: POST
    path: /secrets/create
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Creates persistent secret data with Docker create response semantics.
  - method: DELETE
    path: /secrets/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Deletes a persistent secret by full or unique id prefix.
  - method: GET
    path: /secrets/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Inspects persistent secret metadata without returning its data.
  - method: POST
    path: /secrets/{id}/update
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Updates secret metadata and increments its object version.
  - method: GET
    path: /swarm
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Reports the persistent local single-node control-plane state and Docker manager metadata.
  - method: POST
    path: /swarm/init
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Initializes a local single-node control plane with Docker join and unlock tokens.
  - method: POST
    path: /swarm/join
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Validates join tokens and records the local node identity for the single-host control plane.
  - method: POST
    path: /swarm/leave
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Leaves the local control plane and clears its manager state.
  - method: POST
    path: /swarm/unlock
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Validates the local unlock key and returns Docker's empty success response.
  - method: GET
    path: /swarm/unlockkey
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Returns the local control-plane unlock key after initialization.
  - method: POST
    path: /swarm/update
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Updates local Swarm spec metadata and increments the object version.
  - method: GET
    path: /nodes
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Lists the local manager node after Swarm initialization with id and name filters.
  - method: DELETE
    path: /nodes/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Removes the local single-node manager and clears its control-plane state.
  - method: GET
    path: /nodes/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Inspects the local manager node with Docker node description and status fields.
  - method: POST
    path: /nodes/{id}/update
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Persists local node availability, role, name, and label metadata.
  - method: GET
    path: /services
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Lists service specifications and versions in the local control plane.
  - method: POST
    path: /services/create
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Creates a persistent service specification and reconciles the requested replica task containers in the local guest runtime.
  - method: DELETE
    path: /services/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Removes a local service and its pending task record.
  - method: GET
    path: /services/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Inspects a local service specification and version.
  - method: GET
    path: /services/{id}/logs
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Returns Docker raw-stream logs from every scheduled service task with the standard log filters.
  - method: POST
    path: /services/{id}/update
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Updates a persistent service specification and reconciles its replica task containers in the local guest runtime.
  - method: GET
    path: /tasks
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Lists pending task records created from local service specifications.
  - method: GET
    path: /tasks/{id}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Inspects a local task record and its pending scheduler state.
  - method: GET
    path: /tasks/{id}/logs
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Returns Docker raw-stream logs from the guest container attached to the task; unscheduled tasks return a Docker service error.
  - method: GET
    path: /plugins
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Lists persistent plugin metadata, configuration, settings, filters, and enabled state.
  - method: POST
    path: /plugins/create
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Creates persistent plugin metadata from the Docker plugin request and returns Docker's empty success response.
  - method: GET
    path: /plugins/privileges
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Returns the local plugin privilege policy without granting host network access.
  - method: POST
    path: /plugins/pull
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Records a pulled plugin reference and persistent plugin metadata with Docker status semantics.
  - method: DELETE
    path: /plugins/{name}
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Deletes a persistent plugin metadata record.
  - method: POST
    path: /plugins/{name}/disable
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Persists the disabled state of a plugin and returns Docker's success response.
  - method: POST
    path: /plugins/{name}/enable
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Persists the enabled state of a plugin and returns Docker's success response.
  - method: GET
    path: /plugins/{name}/json
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Inspects persistent plugin metadata and configuration.
  - method: POST
    path: /plugins/{name}/push
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Validates the persistent plugin identity and returns Docker's push response semantics.
  - method: POST
    path: /plugins/{name}/set
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Persists plugin settings without granting host capabilities.
  - method: POST
    path: /plugins/{name}/upgrade
    support: implemented
    owner: DockerControlPlaneRoutes
    note: Updates the persistent plugin reference and version with Docker upgrade semantics.
  - method: POST
    path: /session
    support: implemented
    owner: SessionRoute
    note: Accepts Docker TCP or h2c session upgrade handshakes; the guest interactive stream is negotiated by the caller.
  - method: GET
    path: /distribution/{name}/json
    support: implemented
    owner: DistributionJsonRoute
    note: Registry manifest and platform inspection.
  - method: GET
    path: /info
    support: implemented
    owner: DockerRuntimeRoutes
    note: Reports live guest counts and host/runtime metadata with capability warnings.
  - method: GET
    path: /system/df
    support: implemented
    owner: DockerRuntimeRoutes
    note: Reports guest-backed image, container, volume, and build-cache usage objects with Docker accounting fields.
  - method: GET
    path: /version
    support: implemented
    owner: VersionRoute
    note: Glass Dock build and Docker API compatibility versions.
  - method: POST
    path: /volumes/create
    support: implemented
    owner: VolumeCreateRoute
    note: Local persistent volume creation.
  - method: GET
    path: /volumes
    support: implemented
    owner: VolumeListRoute
    note: Local volume listing.
  - method: GET
    path: /volumes/{name}
    support: implemented
    owner: VolumeInspectRoute
    note: Local volume inspection.
  - method: DELETE
    path: /volumes/{name}
    support: implemented
    owner: VolumeDeleteRoute
    note: Local volume deletion with in-use protection.
  - method: POST
    path: /volumes/prune
    support: implemented
    owner: VolumePruneRoute
    note: Anonymous and all-volume pruning with label filters.
  - method: PUT
    path: /volumes/{name}
    support: implemented
    owner: VolumeUpdateRoute
    note: Updates local volume labels and driver options in persistent metadata.
